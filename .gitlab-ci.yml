variables:
  SMOKE_PRODUCT_NAME: TreasureIsland
  
include:
  - project: "ci/repos-ci/pentagon_l1_treasure_island_service"
    ref: master
    file: "gitlab-ci.yml"


.build:default:image:noenv:
  stage: build
  script:
    - echo $DOCKER_FILE_PATH
    - docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL
    - docker pull $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest || true
    - docker build
      --pull
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
      --cache-from $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest $DOCKER_FILE_PATH
    - docker push $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
  tags:
    - docker

integration-tests:
  stage: test
  needs: ['unit-test-js']
  tags:
    - docker

  services:
    - name: registry.nexdev.net:5050/docker/database/mongo:4.4.8
      alias: mongo
      
  image: registry.nexdev.net:5050/docker/node:18.1-slim
  before_script:
    - cp ./src/app-configs.js ./src/app-configs.original.js
    - cp ./configs/app-configs.IGT.js ./src/app-configs.js
    - npm set registry http://npm.lumigame.com
    - yarn install

  script:
    - npm run integration-test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - junit.xml
    expire_in: 1 day

unit-test-js:
  artifacts:
    reports:
      junit: coverage/*.xml
      cobertura: coverage/cobertura-coverage.xml
